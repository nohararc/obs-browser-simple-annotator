<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OBS Drawing Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      pointer-events: none; /* パレット以外はイベントを通さない */
    }
    #confirmed-canvas,
    #preview-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #confirmed-canvas { z-index: 1; }
    #preview-canvas   { z-index: 2; pointer-events: all; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="confirmed-canvas"></canvas>
    <canvas id="preview-canvas"></canvas>
  </div>
  <!-- パレットとショートカットヒントはTask 2で追加 -->
  <script>
    // canvas のサイズをウィンドウに合わせる
    const confirmedCanvas = document.getElementById('confirmed-canvas');
    const previewCanvas   = document.getElementById('preview-canvas');
    const confirmedCtx    = confirmedCanvas.getContext('2d');
    const previewCtx      = previewCanvas.getContext('2d');

    function resizeCanvases() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // リサイズ時は描画内容がクリアされるためUndoスタックも初期化する
      confirmedCanvas.width  = w;
      confirmedCanvas.height = h;
      previewCanvas.width    = w;
      previewCanvas.height   = h;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();
  </script>
</body>
</html>
