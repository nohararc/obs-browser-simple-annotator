<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OBS Drawing Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      pointer-events: none; /* パレット以外はイベントを通さない */
    }
    #confirmed-canvas,
    #preview-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #confirmed-canvas { z-index: 1; }
    #preview-canvas   { z-index: 2; pointer-events: all; cursor: crosshair; }

    /* パレットUI */
    #palette {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 10px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    #palette-handle {
      color: #555;
      font-size: 14px;
      cursor: grab;
      padding: 2px 0;
      line-height: 1;
    }
    #palette-handle:active { cursor: grabbing; }
    .palette-section-label {
      color: #555;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: sans-serif;
    }
    .palette-divider {
      width: 26px;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }
    .tool-btn, .action-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: serif;
      transition: background 0.1s;
    }
    .tool-btn:hover, .action-btn:hover { background: rgba(255,255,255,0.1); }
    .tool-btn.active { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }
    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.active { border-color: white; transform: scale(1.15); }
    #text-input {
      position: fixed;
      display: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid currentColor;
      outline: none;
      font-size: 20px;
      font-family: sans-serif;
      color: white;
      min-width: 100px;
      z-index: 200;
    }
    #shortcut-hint {
      position: fixed;
      bottom: 12px;
      right: 12px;
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      font-family: monospace;
      pointer-events: none;
      z-index: 50;
    }
    #video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
      pointer-events: none;
    }
    #source-selector {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #source-selector-dialog {
      background: rgba(20, 20, 30, 0.97);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 24px 28px;
      width: 260px;
      text-align: center;
    }
    #source-selector-dialog h3 {
      color: #fff;
      font-size: 15px;
      font-family: sans-serif;
      margin: 0 0 4px;
    }
    #source-selector-dialog p {
      color: rgba(255,255,255,0.45);
      font-size: 11px;
      font-family: sans-serif;
      margin: 0 0 16px;
    }
    .source-btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-family: sans-serif;
      cursor: pointer;
      color: #fff;
    }
    .source-btn:last-child { margin-bottom: 0; }
    .source-btn-camera  { background: #2471a3; }
    .source-btn-display { background: #1e8449; }
    .source-btn-skip    { background: transparent; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.5); font-size: 11px; }
    #source-error {
      color: #e74c3c;
      font-size: 11px;
      font-family: sans-serif;
      margin: 8px 0 0;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <video id="video-bg" autoplay muted playsinline></video>
  <div id="canvas-container">
    <canvas id="confirmed-canvas"></canvas>
    <canvas id="preview-canvas"></canvas>
  </div>

  <div id="palette">
    <div id="palette-handle" title="ドラッグで移動">⠿</div>

    <div class="palette-section-label">ツール</div>
    <button class="tool-btn active" data-tool="pen"    title="ペン (P)">✏️</button>
    <button class="tool-btn"        data-tool="eraser" title="消しゴム (E)">🧹</button>
    <button class="tool-btn"        data-tool="arrow"  title="矢印 (A)">➡️</button>
    <button class="tool-btn"        data-tool="text"   title="テキスト (T)">T</button>

    <div class="palette-divider"></div>
    <div class="palette-section-label">色</div>
    <button class="color-btn active" data-color="#e74c3c" style="background:#e74c3c" title="赤 (1)"></button>
    <button class="color-btn"        data-color="#3498db" style="background:#3498db" title="青 (2)"></button>
    <button class="color-btn"        data-color="#2ecc71" style="background:#2ecc71" title="緑 (3)"></button>
    <button class="color-btn"        data-color="#f1c40f" style="background:#f1c40f" title="黄 (4)"></button>
    <button class="color-btn"        data-color="#ffffff" style="background:#ffffff" title="白 (5)"></button>

    <div class="palette-divider"></div>
    <button class="action-btn" id="btn-undo"  title="元に戻す (Z)">↩️</button>
    <button class="action-btn" id="btn-clear" title="全消去 (C)">🗑️</button>
    <div class="palette-divider"></div>
    <button class="action-btn" id="btn-video" title="映像ソース変更">📹</button>
  </div>

  <input id="text-input" type="text" autocomplete="off" spellcheck="false">

  <div id="shortcut-hint">
    1-5:色 &nbsp;|&nbsp; P:ペン &nbsp;|&nbsp; E:消しゴム &nbsp;|&nbsp; A:矢印 &nbsp;|&nbsp; T:テキスト &nbsp;|&nbsp; Z:戻す &nbsp;|&nbsp; C:消去
  </div>

  <div id="source-selector">
    <div id="source-selector-dialog">
      <h3>映像ソースを選択</h3>
      <p>キャンバスの背景映像を設定します</p>
      <button class="source-btn source-btn-camera"  id="btn-src-camera">📷 カメラ / 仮想カメラ</button>
      <button class="source-btn source-btn-display" id="btn-src-display">🖥 画面・ウィンドウ</button>
      <button class="source-btn source-btn-skip"    id="btn-src-skip">映像なしで開始</button>
      <div id="source-error"></div>
    </div>
  </div>

  <script>
    // canvas のサイズをウィンドウに合わせる
    const confirmedCanvas = document.getElementById('confirmed-canvas');
    const previewCanvas   = document.getElementById('preview-canvas');
    const confirmedCtx    = confirmedCanvas.getContext('2d');
    const previewCtx      = previewCanvas.getContext('2d');

    // === 状態管理 ===
    const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#ffffff'];
    let activeTool  = 'pen';
    let activeColor = COLORS[0];
    let undoStack   = [];
    const UNDO_LIMIT = 20;

    // === 映像ソース管理 ===
    let currentStream = null;

    function stopCurrentStream() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (track) track.removeEventListener('ended', onStreamEnded);
      currentStream.getVideoTracks().forEach(t => t.stop());
      currentStream = null;
    }

    function onStreamEnded() {
      currentStream = null;
      const video = document.getElementById('video-bg');
      video.srcObject = null;
      video.style.display = 'none';
    }

    function applyStream(stream) {
      stopCurrentStream();
      currentStream = stream;
      const track = stream.getVideoTracks()[0];
      if (track) track.addEventListener('ended', onStreamEnded);
      const video = document.getElementById('video-bg');
      video.srcObject = stream;
      video.style.display = 'block';
    }

    function hideSourceSelector() {
      document.getElementById('source-selector').style.display = 'none';
    }

    function showSourceSelector() {
      const sel = document.getElementById('source-selector');
      if (sel.style.display === 'flex') return; // 多重表示防止
      document.getElementById('source-error').textContent = '';
      sel.style.display = 'flex';
    }

    document.getElementById('btn-src-camera').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        applyStream(stream);
        hideSourceSelector();
      } catch (err) {
        // カメラアクセス失敗（権限拒否・デバイスなし・OBS環境等）は自動クローズ
        hideSourceSelector();
      }
    });

    document.getElementById('btn-src-display').addEventListener('click', async () => {
      if (typeof navigator.mediaDevices.getDisplayMedia === 'undefined') {
        document.getElementById('source-error').textContent =
          '画面キャプチャはこの環境では利用できません';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        applyStream(stream);
        hideSourceSelector();
      } catch (err) {
        // ユーザーキャンセル: ダイアログ維持（再選択を促す）
        if (err.name !== 'NotAllowedError') {
          document.getElementById('source-error').textContent =
            'キャプチャに失敗しました: ' + err.message;
        }
      }
    });

    document.getElementById('btn-src-skip').addEventListener('click', hideSourceSelector);

    document.getElementById('btn-video').addEventListener('click', () => {
      stopCurrentStream();
      const video = document.getElementById('video-bg');
      video.srcObject = null;
      video.style.display = 'none';
      showSourceSelector();
    });

    function resizeCanvases() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // リサイズ時は描画内容がクリアされるためUndoスタックも初期化する
      confirmedCanvas.width  = w;
      confirmedCanvas.height = h;
      previewCanvas.width    = w;
      previewCanvas.height   = h;
      undoStack = [];
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function pushUndo() {
      undoStack.push(
        confirmedCtx.getImageData(0, 0, confirmedCanvas.width, confirmedCanvas.height)
      );
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    }

    function undo() {
      if (undoStack.length === 0) return;
      confirmedCtx.putImageData(undoStack.pop(), 0, 0);
    }

    function clearAll() {
      undoStack = [];
      confirmedCtx.clearRect(0, 0, confirmedCanvas.width, confirmedCanvas.height);
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    }

    // === ツール・カラー切り替えのイベントリスナー ===
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTool = btn.dataset.tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeColor = btn.dataset.color;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-clear').addEventListener('click', clearAll);

    // === パレットのドラッグ移動 + localStorage位置保存 ===
    const palette = document.getElementById('palette');
    const handle  = document.getElementById('palette-handle');
    const STORAGE_KEY = 'obs-annotator-palette-pos';

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        palette.style.left      = saved.left;
        palette.style.top       = saved.top;
        palette.style.transform = 'none';
      }
    } catch (_) {}

    let dragOffset = { x: 0, y: 0 };
    handle.addEventListener('mousedown', e => {
      const rect = palette.getBoundingClientRect();
      dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      palette.style.transform = 'none';
      window.addEventListener('mousemove', onDrag);
      window.addEventListener('mouseup',   stopDrag, { once: true });
    });

    function onDrag(e) {
      const pr = palette.getBoundingClientRect();
      const left = Math.max(0, Math.min(window.innerWidth  - pr.width,  e.clientX - dragOffset.x));
      const top  = Math.max(0, Math.min(window.innerHeight - pr.height, e.clientY - dragOffset.y));
      palette.style.left = left + 'px';
      palette.style.top  = top  + 'px';
    }

    function stopDrag() {
      window.removeEventListener('mousemove', onDrag);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          left: palette.style.left,
          top:  palette.style.top,
        }));
      } catch (_) {}
    }

    // === 描画の共通状態 ===
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function getCanvasPos(e) {
      const rect = previewCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (previewCanvas.width  / rect.width),
        y: (e.clientY - rect.top)  * (previewCanvas.height / rect.height),
      };
    }

    previewCanvas.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      const pos = getCanvasPos(e);

      if (activeTool === 'pen' || activeTool === 'eraser') {
        pushUndo();
        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
        drawStroke(pos.x, pos.y, pos.x, pos.y);
      }
      if (activeTool === 'arrow') {
        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
        // Undoはmouseup時（確定後）に積む
      }
      if (activeTool === 'text') {
        const input = document.getElementById('text-input');

        // 前のセッションが残っていれば先にクリーンアップ
        if (input._cleanupText) { input._cleanupText(); }

        input.style.display = 'block';
        input.style.left    = e.clientX + 'px';
        input.style.top     = (e.clientY - 20) + 'px';
        input.style.color   = activeColor;
        input.value         = '';
        input.focus();

        function onTextInput() {
          previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
          if (input.value) {
            drawText(previewCtx, input.value, pos.x, pos.y, activeColor);
          }
        }
        function handleKeydown(ke) {
          if (ke.key === 'Enter')  { commitText(); }
          if (ke.key === 'Escape') { cancelText(); }
        }
        function cleanupText() {
          input.removeEventListener('input',   onTextInput);
          input.removeEventListener('blur',    cancelText);
          input.removeEventListener('keydown', handleKeydown);
          input._cleanupText = null;
        }
        function commitText() {
          previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
          if (input.value.trim()) {
            pushUndo();
            drawText(confirmedCtx, input.value, pos.x, pos.y, activeColor);
          }
          input.style.display = 'none';
          input.value = '';
          cleanupText();
        }
        function cancelText() {
          previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
          input.style.display = 'none';
          input.value = '';
          cleanupText();
        }

        input._cleanupText = cleanupText;
        input.addEventListener('input',   onTextInput);
        input.addEventListener('blur',    cancelText);
        input.addEventListener('keydown', handleKeydown);
      }
    });

    previewCanvas.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);
      if (activeTool === 'arrow' && isDrawing) {
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        drawArrow(previewCtx, lastX, lastY, pos.x, pos.y, activeColor);
      }
      if (activeTool !== 'pen' && activeTool !== 'eraser') return;
      drawStroke(lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
    });

    previewCanvas.addEventListener('mouseleave', () => {
      isDrawing = false;
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    });
    previewCanvas.addEventListener('mouseup', e => {
      if (!isDrawing) return;
      if (activeTool === 'arrow') {
        const pos = getCanvasPos(e);
        isDrawing = false;
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        // 終点が始点と同じなら無視（クリックのみ）
        if (Math.abs(pos.x - lastX) < 3 && Math.abs(pos.y - lastY) < 3) return;
        pushUndo();
        drawArrow(confirmedCtx, lastX, lastY, pos.x, pos.y, activeColor);
      } else {
        isDrawing = false; // ペン・消しゴム: mouseup時も描画を終了する
      }
    });

    function drawStroke(x1, y1, x2, y2) {
      if (activeTool === 'eraser') {
        confirmedCtx.save();
        confirmedCtx.globalCompositeOperation = 'destination-out';
        confirmedCtx.lineWidth   = 20;
        confirmedCtx.lineCap     = 'round';
        confirmedCtx.beginPath();
        confirmedCtx.moveTo(x1, y1);
        confirmedCtx.lineTo(x2, y2);
        confirmedCtx.stroke();
        confirmedCtx.restore();
      } else {
        confirmedCtx.lineWidth    = 4;
        confirmedCtx.lineCap      = 'round';
        confirmedCtx.lineJoin     = 'round';
        confirmedCtx.strokeStyle  = activeColor;
        confirmedCtx.shadowColor  = 'rgba(0,0,0,0.5)';
        confirmedCtx.shadowBlur   = 4;
        confirmedCtx.shadowOffsetX = 1;
        confirmedCtx.shadowOffsetY = 1;
        confirmedCtx.beginPath();
        confirmedCtx.moveTo(x1, y1);
        confirmedCtx.lineTo(x2, y2);
        confirmedCtx.stroke();
        confirmedCtx.shadowColor   = 'transparent';
        confirmedCtx.shadowBlur    = 0;
        confirmedCtx.shadowOffsetX = 0;
        confirmedCtx.shadowOffsetY = 0;
      }
    }

    // 矢印を描く関数（ctx: 対象コンテキスト）
    function drawArrow(ctx, x1, y1, x2, y2, color) {
      const headLen = 10; // 矢じりの長さ（仕様書: 10px）
      const angle   = Math.atan2(y2 - y1, x2 - x1);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle   = color;
      ctx.lineWidth   = 3;
      ctx.lineCap     = 'round';

      // 軸線
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // 矢じり
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - headLen * Math.cos(angle - Math.PI / 6),
        y2 - headLen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x2 - headLen * Math.cos(angle + Math.PI / 6),
        y2 - headLen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // テキストをcanvasに描く（アウトライン付き）
    function drawText(ctx, text, x, y, color) {
      ctx.save();
      ctx.font         = '20px sans-serif';
      ctx.fillStyle    = color;
      ctx.strokeStyle  = 'rgba(0,0,0,0.8)';
      ctx.lineWidth    = 3;
      ctx.lineJoin     = 'round';
      ctx.strokeText(text, x, y);
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // === キーボードショートカット ===
    document.addEventListener('keydown', e => {
      // テキスト入力中はショートカットを無視
      if (document.activeElement === document.getElementById('text-input')) return;
      // ソース選択ダイアログ表示中はショートカットを無視
      if (document.getElementById('source-selector').style.display !== 'none') return;

      const toolMap = { 'p': 'pen', 'e': 'eraser', 'a': 'arrow', 't': 'text' };
      const colorMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 };
      const key = e.key.toLowerCase();

      if (toolMap[key]) {
        e.preventDefault();
        activeTool = toolMap[key];
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tool === activeTool);
        });
      } else if (colorMap[key] !== undefined) {
        e.preventDefault();
        activeColor = COLORS[colorMap[key]];
        document.querySelectorAll('.color-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === activeColor);
        });
      } else if (key === 'z') {
        e.preventDefault();
        undo();
      } else if (key === 'c') {
        e.preventDefault();
        clearAll();
      }
    });

    // === 右クリックメニューの無効化 ===
    document.addEventListener('contextmenu', e => e.preventDefault());

    // === 起動時ソース選択 ===
    showSourceSelector();
  </script>
</body>
</html>
